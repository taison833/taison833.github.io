  box-shadow: 0 0 24px rgba(168,85,247,.55), 0 0 60px rgba(34,211,238,.18);
}

.game-card {
  transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
}

.game-card:hover {
  transform: translateY(-7px);
  border-color: rgba(168,85,247,.85);
  box-shadow: 0 18px 48px rgba(168,85,247,.28), 0 0 0 1px rgba(236,72,153,.25), 0 0 34px rgba(236,72,153,.18);
}

  transform: scale(1.14) rotate(-3deg);
}

  transition: transform .25s ease;
  filter: drop-shadow(0 12px 20px rgba(0,0,0,.45));
}

.play-btn {
  transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
}

.play-btn:hover {
  transform: translateY(-2px);
  filter: brightness(1.12);
  box-shadow: 0 10px 28px rgba(236,72,153,.45);
}

.ghost-btn {
  transition: all .2s ease;
}

.ghost-btn:hover {
  background: rgba(34,211,238,.13);
  border-color: var(--cyan);
  color: #fff;
}

.filter-btn {
  transition: all .2s ease;
}

.filter-btn:hover {
  border-color: var(--purple);
  color: white;
}

@keyframes marquee {
  from {
    transform: translateX(0);
  }

  to {
    transform: translateX(-50%);
  }
}

.marquee-track {
  animation: marquee 22s linear infinite;
}

@keyframes floaty {
  0%,100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-8px);
  }
}

.floaty {
  animation: floaty 4s ease-in-out infinite;
}

@keyframes blink {
  0%,100% {
    opacity: 1;
  }

  50% {
    opacity: .25;
  }
}

.blink {
  animation: blink 1.4s infinite;
}

.no-scrollbar::-webkit-scrollbar {
  display: none;
}

.no-scrollbar {
  scrollbar-width: none;
}

.last\:border-r-0:last-child{
  border-right-width: 0px;
}

@media (min-width: 640px){
  .sm\:mx-0{
    margin-left: 0px;
    margin-right: 0px;
  }

  .sm\:flex{
    display: flex;
  }

  .sm\:min-w-\[220px\]{
    min-width: 220px;
  }

  .sm\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:flex-row{
    flex-direction: row;
  }

  .sm\:flex-wrap{
    flex-wrap: wrap;
  }

  .sm\:items-center{
    align-items: center;
  }

  .sm\:p-7{
    padding: 1.75rem;
  }

  .sm\:px-0{
    padding-left: 0px;
    padding-right: 0px;
  }

  .sm\:px-6{
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:py-5{
    padding-top: 1.25rem;
    padding-bottom: 1.25rem;
  }

  .sm\:pt-16{
    padding-top: 4rem;
  }

  .sm\:text-3xl{
    font-size: 1.875rem;
    line-height: 2.25rem;
  }

  .sm\:text-4xl{
    font-size: 2.25rem;
    line-height: 2.5rem;
  }

  .sm\:text-lg{
    font-size: 1.125rem;
    line-height: 1.75rem;
  }

  .sm\:text-xs{
    font-size: 0.75rem;
    line-height: 1rem;
  }
}

@media (min-width: 1024px){
  .lg\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .lg\:px-8{
    padding-left: 2rem;
    padding-right: 2rem;
  }
}
